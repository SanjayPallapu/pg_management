name: Build Android App Bundle (AAB)

on:
  push:
    branches:
      - main
      - early-access
    tags:
      - 'play-release-*'
  workflow_dispatch:
    inputs:
      release_action:
        description: Build only or explicitly publish a completed closed-testing release
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - upload-closed-testing

permissions:
  contents: read

concurrency:
  group: android-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Sign AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Validate Android Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing_secrets=0

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub secret: KEYSTORE_BASE64"
            missing_secrets=1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing GitHub secret: KEYSTORE_PASSWORD"
            missing_secrets=1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing GitHub secret: KEY_ALIAS"
            missing_secrets=1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing GitHub secret: KEY_PASSWORD"
            missing_secrets=1
          fi

          if [ "$missing_secrets" -ne 0 ]; then
            exit 1
          fi

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          echo "Keystore successfully decoded."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PG-HUB-AAB-${{ github.run_number }}-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Write Workflow Summary
        if: ${{ always() }}
        run: |
          version_code=$((GITHUB_RUN_NUMBER + 200))

          {
            echo "## PG HUB Android AAB"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Run number: \`${GITHUB_RUN_NUMBER}\`"
            echo "- Version code: \`${version_code}\`"
            if [ "${{ github.event_name }}" = "push" ] && [[ "${GITHUB_REF}" == refs/tags/play-release-* ]]; then
              echo "- Requested action: publish tagged release to Google Play closed testing"
            elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release_action }}" = "upload-closed-testing" ]; then
              echo "- Requested action: publish to Google Play closed testing"
            else
              echo "- Requested action: build only"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  upload-closed-testing:
    name: Publish to Google Play Closed Testing
    if: >-
      ${{
        github.repository == 'SanjayPallapu/pg_management' &&
        (
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/play-release-')) ||
          (github.event_name == 'workflow_dispatch' && inputs.release_action == 'upload-closed-testing' && github.ref == 'refs/heads/main')
        )
      }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: google-play-alpha
    concurrency:
      group: google-play-alpha-upload
      cancel-in-progress: false

    steps:
      - name: Download Signed AAB
        uses: actions/download-artifact@v4
        with:
          name: PG-HUB-AAB-${{ github.run_number }}-${{ github.sha }}
          path: release

      - name: Validate Google Play Secret
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing GitHub secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

      - name: Upload Completed Release to Google Play Closed Testing
        id: google_play_upload
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sanjay.pgmanagement
          releaseFiles: release/app-release.aab
          tracks: alpha
          status: completed
          releaseName: PG HUB ${{ github.sha }}

      - name: Write Upload Summary
        if: ${{ always() }}
        run: |
          version_code=$((GITHUB_RUN_NUMBER + 200))

          {
            echo "## Google Play closed-testing release"
            echo ""
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run number: \`${GITHUB_RUN_NUMBER}\`"
            echo "- Version code: \`${version_code}\`"
            echo "- Track: \`alpha\`"
            echo "- Release status: \`completed\`"
            echo "- Upload result: \`${{ steps.google_play_upload.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
