    <script>
      // Prevent flash by setting theme early
      (function() {
        try {
          var theme = localStorage.getItem('pg-manager-theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();

      // Global startup error & chunk failure handler for WebView
      window.addEventListener('error', function(event) {
        var msg = (event.message || '').toLowerCase();
        if (msg.includes('script error') || msg.includes('loading chunk') || msg.includes('failed to fetch dynamically imported module') || msg.includes('importing a module script failed')) {
          console.warn('[StartupError] Chunk load failure detected in WebView:', event.message);
          if ('caches' in window) {
            caches.keys().then(function(keys) { keys.forEach(function(k) { caches.delete(k); }); });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) { regs.forEach(function(r) { r.unregister(); }); });
          }
          var key = 'pg_chunk_err_reload';
          if (!sessionStorage.getItem(key)) {
            sessionStorage.setItem(key, 'true');
            setTimeout(function() { window.location.reload(); }, 300);
          }
        }
      });
    </script>
