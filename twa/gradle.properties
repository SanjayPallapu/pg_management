# Ultra Performance Gradle settings
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.vfs.watch=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# High Performance AAPT2 settings
android.aapt2.daemon.maxHeapSize=4096M
# Use more threads for resource linking to prevent timeouts
android.aapt2.threadPoolSize=8

# AndroidX support
android.useAndroidX=true
# DISABLE JETIFIER: Massive speed boost for projects already on AndroidX
android.enableJetifier=false

# Multi-module build optimization (CRITICAL for 11+ plugins)
android.nonTransitiveRClass=true
