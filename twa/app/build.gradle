apply plugin: 'com.android.application'

android {
    namespace "com.sanjay.pgmanagement.twatest"
    compileSdk 35

    defaultConfig {
        applicationId "com.sanjay.pgmanagement.twatest"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 1
        versionName "1.0.0-twatest"
    }

    signingConfigs {
        testSign {
            storeFile file('test.keystore')
            storePassword 'pghubtest123'
            keyAlias 'pghubtest'
            keyPassword 'pghubtest123'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.testSign
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.testSign
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    resolutionStrategy {
        eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.jetbrains.kotlin' && 
                (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")
            }
        }
    }
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because("kotlin-stdlib-jdk7 is now part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because("kotlin-stdlib-jdk8 is now part of kotlin-stdlib")
        }
    }
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
