apply plugin: 'com.android.application'

android {
    namespace "com.sanjay.pgmanagement.twatest"
    compileSdk 35

    defaultConfig {
        applicationId "com.sanjay.pgmanagement.twatest"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 1
        versionName "1.0.0-twatest"

        resValue "string", "app_name", "PG HUB (TWA Test)"
        resValue "string", "twa_default_url", "https://pgmanagee.vercel.app"
    }

    signingConfigs {
        testSign {
            def keystoreFile = file('test.keystore')
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword 'pghubtest123'
                keyAlias 'pghubtest'
                keyPassword 'pghubtest123'
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.testSign
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.testSign
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
