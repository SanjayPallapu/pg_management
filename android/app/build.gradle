apply plugin: 'com.android.application'

android {
    namespace "com.sanjay.pgmanagement"
    compileSdk rootProject.ext.compileSdkVersion
    
    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.sanjay.pgmanagement"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    aaptOptions {
        cruncherEnabled = false
        noCompress 'png', 'jpg', 'jpeg', 'webp', 'xml'
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    sourceSets {
        main {
            res.exclude '**/splash.png'
            res.exclude '**/config 2.xml'
            res.exclude '**/config 3.xml'
            res.exclude '**/config*.xml'
        }
    }

    signingConfigs {
        release {
            def keystoreFile = file('release.keystore')
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: (project.findProperty('RELEASE_STORE_PASSWORD') ?: '')
                keyAlias System.getenv("KEY_ALIAS") ?: (project.findProperty('RELEASE_KEY_ALIAS') ?: '')
                keyPassword System.getenv("KEY_PASSWORD") ?: (project.findProperty('RELEASE_KEY_PASSWORD') ?: '')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false 
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            
            def keystoreFile = file('release.keystore')
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Force Kotlin tasks in this module to JVM 17
    if (project.plugins.hasPlugin('kotlin-android') || project.plugins.hasPlugin('org.jetbrains.kotlin.android')) {
        kotlinOptions {
            jvmTarget = '17'
        }
    }
}

// Robust task to delete files with illegal names (e.g. config 3.xml)
tasks.register('forceDeleteBadFiles') {
    def xmlDir = project.layout.projectDirectory.dir('src/main/res/xml').asFile
    doLast {
        if (xmlDir.exists()) {
            xmlDir.listFiles()?.each { f ->
                if (f.name.contains(' ')) {
                    System.out.println("DELETING INVALID RESOURCE FILE: ${f.name}")
                    f.delete()
                }
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'preBuild' || (task.name.contains("Resources") && (task.name.contains("merge") || task.name.contains("package")))) {
        task.dependsOn 'forceDeleteBadFiles'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// REINFORCEMENT BLOCK: Force JVM 17 for both Java and Kotlin at the end of the file.
// This prevents capacitor.build.gradle or other scripts from overriding the target to 21.
android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    // Only apply if the Kotlin plugin is actually applied to the project
    if (project.plugins.hasPlugin('kotlin-android') || project.plugins.hasPlugin('org.jetbrains.kotlin.android')) {
        kotlinOptions {
            jvmTarget = '17'
        }
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists()) {
        apply plugin: 'com.google.gms:google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
