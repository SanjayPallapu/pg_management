// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Global performance and compatibility optimization for all sub-projects
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            android {
                // Force Java 17 compatibility
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                
                // Disable resource crunching to prevent AAPT2 timeouts
                aaptOptions {
                    cruncherEnabled = false
                }
            }
        }
        
        // Force Toolchain to Java 17 to bypass Java 21 requirement errors
        if (project.plugins.hasPlugin('java') || project.plugins.hasPlugin('java-library')) {
            project.extensions.getByType(JavaPluginExtension).toolchain {
                languageVersion = JavaLanguageVersion.of(17)
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
