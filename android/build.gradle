// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25"
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Global performance and compatibility optimization for all sub-projects
subprojects {
    // Apply JVM Toolchain to ensure both Java and Kotlin use JDK 17
    // This resolves "Inconsistent JVM-target" by forcing a single version globally.
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                
                // Force Kotlin inside the android block
                if (project.plugins.hasPlugin('kotlin-android') || project.plugins.hasPlugin('org.jetbrains.kotlin.android')) {
                    kotlinOptions {
                        jvmTarget = '17'
                    }
                }
            }
        }

        // Force Toolchain 17 for all modules that support it
        if (project.plugins.hasPlugin('java') || project.plugins.hasPlugin('java-library') ||
            project.plugins.hasPlugin('kotlin') || project.plugins.hasPlugin('kotlin-android') || 
            project.plugins.hasPlugin('org.jetbrains.kotlin.android')) {
            
            project.extensions.findByType(org.gradle.api.plugins.JavaPluginExtension)?.toolchain {
                languageVersion = JavaLanguageVersion.of(17)
            }
        }

        // Catch-all: Explicitly set jvmTarget for any Kotlin compilation task
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "17"
            }
        }
        
        // Catch-all: Explicitly set compatibility for any Java compilation task
        project.tasks.withType(JavaCompile).configureEach {
            sourceCompatibility = '17'
            targetCompatibility = '17'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
